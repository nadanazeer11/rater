name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # prisma generate reads the datasource block but does not connect; a
      # syntactically-valid placeholder keeps the CLI quiet.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      # next build inlines NEXT_PUBLIC_* at compile time; placeholders keep the
      # Supabase/client constructors from throwing on an invalid/missing value.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      NEXT_PUBLIC_GOOGLE_PLACES_API_KEY: placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @rater/db run db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
